# Начальный конфиг сайта, только HTTP: нужен один раз, до выпуска сертификата.
# certbot --nginx допишет в него HTTPS; итоговая версия хранится в sm-to.conf.
# Заголовки прокси: /etc/nginx/snippets/sm-to-proxy.conf (из proxy-headers.conf).
# Конфиг не ссылается на /opt/sm-to: nginx не зависит от состояния репозитория.

# Ограничение частоты входа: 5 попыток в минуту с одного IP.
# Имя зоны уникально, чтобы не пересечься с другими сайтами сервера.
limit_req_zone $binary_remote_addr zone=sm_to_login:1m rate=5r/m;

# www ведёт на основной домен: один origin для cookie и проверки CSRF.
# return внутри location, а не на уровне server: иначе редирект перехватит
# проверку certbot (/.well-known/acme-challenge/) и сертификат для www не выпустится.
server {
    listen 80;
    server_name www.specmontazh.online;

    location / {
        return 301 https://specmontazh.online$request_uri;
    }
}

server {
    listen 80;
    server_name specmontazh.online;

    root /opt/sm-to/apps/web/dist;
    index index.html;

    client_max_body_size 1m;

    location = /api/v1/auth/login {
        limit_req zone=sm_to_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3010;
        include /etc/nginx/snippets/sm-to-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        include /etc/nginx/snippets/sm-to-proxy.conf;
    }

    # Сборка Vite кладёт файлы с хешем в имени, их можно кешировать надолго.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой неизвестный путь отдаёт index.html.
    location / {
        try_files $uri /index.html =404;
        add_header Cache-Control "no-cache";
    }
}
